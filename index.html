
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EarthGrid | Digital Land Explorer</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      background: #07111e;
    }

    #globe {
      position: fixed;
      inset: 0;
    }

    .brand {
      position: fixed;
      z-index: 2;
      top: 14px;
      left: 14px;
      padding: 12px 16px;
      border: 1px solid #805a2c;
      border-radius: 12px;
      background: #07111eea;
    }

    .brand h1 {
      margin: 0;
      color: #ffb347;
      font-size: 22px;
    }

    .brand p {
      margin: 5px 0 0;
      color: #c5d0df;
      font-size: 11px;
    }

    .panel {
      position: fixed;
      z-index: 2;
      top: 100px;
      right: 12px;
      width: 290px;
      max-width: calc(100vw - 24px);
      padding: 16px;
      border: 1px solid #805a2c;
      border-radius: 14px;
      background: #07111ef2;
    }

    .panel h2 {
      margin: 0 0 14px;
      color: #ffb347;
      font-size: 17px;
    }

    input, button {
      width: 100%;
      padding: 11px;
      margin-bottom: 8px;
      border-radius: 8px;
      font-size: 13px;
    }

    input {
      color: white;
      background: #102236;
      border: 1px solid #53677d;
    }

    button {
      cursor: pointer;
      border: 0;
      background: #ffb347;
      color: #17202b;
      font-weight: bold;
    }

    button.secondary {
      background: #20364b;
      color: white;
    }

    .info {
      margin-top: 10px;
      border-top: 1px solid #34485b;
      padding-top: 8px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #203246;
      font-size: 12px;
    }

    .item span:first-child { color: #aebed0; }
    .item span:last-child { overflow-wrap: anywhere; }

    #price { color: #ffb347; font-weight: bold; }

    #status {
      position: fixed;
      z-index: 3;
      bottom: 12px;
      left: 12px;
      right: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #07111eea;
      color: #d4dfeb;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: #07111e;
      color: #ffb347;
      text-align: center;
      line-height: 2;
    }

    @media (max-width: 600px) {
      .brand { top: 8px; left: 8px; }
      .brand h1 { font-size: 18px; }
      .panel {
        top: 88px;
        right: 8px;
        width: 240px;
        padding: 12px;
      }
      #status { font-size: 10px; }
    }
  </style>
</head>

<body>
  <div id="globe"></div>

  <div class="brand">
    <h1>EarthGrid</h1>
    <p>کاوشگر سه‌بعدی قطعات زمین</p>
  </div>

  <section class="panel">
    <h2>جست‌وجوی قطعه</h2>

    <input id="search" placeholder="مثلاً EG-1001">
    <button id="searchBtn">جست‌وجو</button>
    <button id="resetBtn" class="secondary">نمای اولیه کره</button>

    <div class="info">
      <div class="item">
        <span>شناسه</span>
        <span id="parcelId">انتخاب نشده</span>
      </div>
      <div class="item">
        <span>عرض جغرافیایی</span>
        <span id="latitude">—</span>
      </div>
      <div class="item">
        <span>طول جغرافیایی</span>
        <span id="longitude">—</span>
      </div>
      <div class="item">
        <span>قیمت آزمایشی</span>
        <span id="price">—</span>
      </div>
    </div>

    <p style="font-size:11px;color:#bdc9d8;line-height:1.9">
      روی خانه‌های نارنجی کلیک کن. قیمت‌ها و قطعات این نسخه آزمایشی‌اند و مالکیت قانونی زمین را نشان نمی‌دهند.
    </p>
  </section>

  <div id="loading">
    <div>
      <h2>EarthGrid</h2>
      <div id="loadingText">در حال بارگذاری کرهٔ زمین...</div>
    </div>
  </div>

  <div id="status">در حال آماده‌سازی...</div>

  <script src="https://unpkg.com/globe.gl"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3/dist/d3-geo.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

  <script>
    (async function () {
      "use strict";

      const loading = document.getElementById("loading");
      const loadingText = document.getElementById("loadingText");
      const status = document.getElementById("status");

      let globe;
      let parcels = [];

      function fail(message) {
        loadingText.textContent = message;
        status.textContent = "بارگذاری ناموفق بود. اتصال اینترنت را بررسی کنید.";
      }

      function makeParcels(land) {
        const result = [];
        let number = 1001;
        const step = 3;

        for (let lat = -54; lat < 75; lat += step) {
          for (let lon = -180; lon < 180; lon += step) {
            const centerLat = lat + step / 2;
            const centerLon = lon + step / 2;

            if (!d3.geoContains(land, [centerLon, centerLat])) {
              continue;
            }

            result.push({
              type: "Feature",
              properties: {
                id: "EG-" + number,
                lat: centerLat,
                lon: centerLon,
                price: 500 + ((number * 137) % 9500)
              },
              geometry: {
                type: "Polygon",
                coordinates: [[
                  [lon, lat],
                  [lon + step, lat],
                  [lon + step, lat + step],
                  [lon, lat + step],
                  [lon, lat]
                ]]
              }
            });

            number++;
          }
        }

        return result;
      }

      function selectParcel(parcel) {
        if (!parcel) return;

        const p = parcel.properties;

        document.getElementById("parcelId").textContent = p.id;
        document.getElementById("latitude").textContent =
          p.lat.toFixed(2) + "°";
        document.getElementById("longitude").textContent =
          p.lon.toFixed(2) + "°";
        document.getElementById("price").textContent =
          p.price.toLocaleString("en-US") + " USD";
        document.getElementById("search").value = p.id;

        globe.pointOfView({
          lat: p.lat,
          lng: p.lon,
          altitude: 1.8
        }, 900);
      }

      try {
        loadingText.textContent = "در حال بررسی کتابخانه‌ها...";

        if (
          typeof Globe !== "function" ||
          typeof d3 === "undefined" ||
          typeof topojson === "undefined"
        ) {
          throw new Error("کتابخانه‌ها بارگذاری نشدند؛ اینترنت را بررسی کنید.");
        }

        loadingText.textContent = "در حال دریافت نقشهٔ زمین...";

        const response = await fetch(
          "https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json"
        );

        if (!response.ok) {
          throw new Error("دریافت اطلاعات نقشه ناموفق بود.");
        }

        const world = await response.json();
        const land = topojson.feature(world, world.objects.land);

        loadingText.textContent = "در حال ساخت قطعات و مرزها...";

        parcels = makeParcels(land);

        if (!parcels.length) {
          throw new Error("قطعه‌ای ساخته نشد.");
        }

        globe = Globe()(document.getElementById("globe"))
          .backgroundColor("#07111e")
          .globeImageUrl(
            "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
          )
          .showAtmosphere(true)
          .atmosphereColor("#4289bd")
          .atmosphereAltitude(0.15)
          .polygonsData(parcels)
          .polygonCapColor(() => "rgba(255,165,50,0.08)")
          .polygonSideColor(() => "rgba(255,165,50,0.04)")
          .polygonStrokeColor(() => "#ffad42")
          .polygonAltitude(0.004)
          .polygonLabel(d => d.properties.id)
          .onPolygonClick(d => selectParcel(d));

        globe
          .width(window.innerWidth)
          .height(window.innerHeight)
          .pointOfView({ lat: 20, lng: 10, altitude: 2.3 }, 0);

        function resize() {
          globe.width(window.innerWidth);
          globe.height(window.innerHeight);
        }

        window.addEventListener("resize", resize);

        document.getElementById("searchBtn").onclick = function () {
          const query = document.getElementById("search")
            .value.trim().toUpperCase();

          const parcel = parcels.find(
            p => p.properties.id.toUpperCase() === query
          );

          if (!parcel) {
            alert("قطعه پیدا نشد. نمونه: EG-1001");
            return;
          }

          selectParcel(parcel);
        };

        document.getElementById("search").addEventListener(
          "keydown",
          function (event) {
            if (event.key === "Enter") {
              document.getElementById("searchBtn").click();
            }
          }
        );

        document.getElementById("resetBtn").onclick = function () {
          globe.pointOfView({ lat: 20, lng: 10, altitude: 2.3 }, 900);
        };

        status.textContent =
          "تعداد قطعات آزمایشی: " +
          parcels.length.toLocaleString("en-US") +
          " | خطوط نارنجی مرز شبکه هستند.";

        document.getElementById("parcelId").textContent =
          parcels[0].properties.id;

        document.getElementById("latitude").textContent =
          parcels[0].properties.lat.toFixed(2) + "°";

        document.getElementById("longitude").textContent =
          parcels[0].properties.lon.toFixed(2) + "°";

        document.getElementById("price").textContent =
          parcels[0].properties.price.toLocaleString("en-US") + " USD";

        loading.style.display = "none";

      } catch (error) {
        console.error(error);
        fail(error.message || "خطای ناشناخته");
      }
    })();
  </script>
</body>
</html>
