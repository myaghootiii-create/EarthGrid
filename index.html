<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#05080d">
<title>EarthGrid | Explore Digital Land</title>

<style>
:root {
  --bg: #05080d;
  --panel: rgba(10, 16, 26, .96);
  --orange: #ff8a24;
  --text: #f5f7fa;
  --muted: #a8b2c2;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

#globeViz {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(
    to bottom,
    rgba(5,8,13,.95),
    transparent
  );
  pointer-events: none;
}

.logo {
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 2px;
}

.logo span {
  color: var(--orange);
}

.badge {
  color: #ffb36c;
  font-size: 10px;
  letter-spacing: 1.5px;
}

.panel {
  position: fixed;
  z-index: 20;
  left: 16px;
  bottom: 16px;
  width: min(350px, calc(100vw - 32px));
  max-height: 55vh;
  overflow-y: auto;
  padding: 17px;
  border: 1px solid rgba(255,138,36,.45);
  border-radius: 15px;
  background: var(--panel);
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  backdrop-filter: blur(12px);
}

.panel h2 {
  margin: 0 0 8px;
  font-size: 18px;
}

.description {
  margin: 0 0 13px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.search {
  display: flex;
  gap: 8px;
}

input {
  width: 0;
  min-width: 0;
  flex: 1;
  padding: 12px 10px;
  border: 1px solid #354154;
  border-radius: 8px;
  outline: none;
  color: white;
  background: #131c29;
  font-size: 13px;
}

input:focus {
  border-color: var(--orange);
}

button {
  border: none;
  border-radius: 8px;
  padding: 11px 13px;
  background: var(--orange);
  color: #17100a;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
}

.secondary {
  margin-top: 8px;
  width: 100%;
  color: #
