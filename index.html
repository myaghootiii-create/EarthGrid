<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarthGrid | 3D Land Explorer</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050b16;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

#globeViz {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.panel {
  position: absolute;
  z-index: 5;
  top: 14px;
  left: 14px;
  width: min(350px, calc(100% - 28px));
  padding: 18px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 16px;
  background: rgba(5,12,26,.91);
  box-shadow: 0 8px 35px rgba(0,0,0,.35);
  backdrop-filter: blur(12px);
}

h1 {
  margin: 0 0 5px;
  font-size: 25px;
  color: #f3bd61;
  letter-spacing: 1px;
}

.subtitle {
  margin-bottom: 15px;
  color: #aab8cc;
  font-size: 12px;
}

input {
  display: block;
  width: 100%;
  padding: 12px;
  margin-bottom: 9px;
  border: 1px solid #39475d;
  border-radius: 8px;
  outline: none;
  background: #101c30;
  color: white;
  font-size: 14px;
}

button {
  padding: 11px;
  border: 0;
  border-radius: 8px;
  background: #eab45b;
  color: #101522;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

.actions {
  display: flex;
  gap: 8px;
}

.actions button {
  flex: 1;
}

#status {
  margin-top: 12px;
  padding: 10px;
  border-radius: 8px;
  background: rgba(255,255,255,.06);
  color: #d2dbea;
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

#parcelInfo {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid rgba(234,180,91,.4);
  border-radius: 9px;
  background: rgba(234,180,91,.08);
  line-height: 1.8;
  font-size: 13px;
  display: none;
}

#parcelInfo strong {
  color: #f3bd61;
}

#legend {
  position: absolute;
  z-index: 4;
  bottom: 18px;
  right: 15px;
  padding: 11px 14px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 10px;
  background: rgba(5,12,26,.85);
  font-size: 12px;
  line-height: 1.9;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 6px;
  border-radius: 50%;
  background: #ffad42;
}

#hint {
  position: absolute;
  z-index: 3;
  bottom: 18px;
  left: 15px;
  max-width: 50%;
  color: #b9c7d9;
  font-size: 11px;
}

@media (max-width: 500px) {
  .panel {
    top: 8px;
    left: 8px;
    padding: 13px;
    width: min(310px, calc(100% - 16px));
  }

  h1 {
    font-size: 22px;
  }

  #legend {
    bottom: 10px;
    right: 8px;
    font-size: 10px;
  }

  #hint {
    bottom: 10px;
    left: 8px;
    max-width: 43%;
  }
}
</style>
</head>

<body>

<div id="globeViz"></div>

<div class="panel">
  <h1>EarthGrid</h1>
  <div class="subtitle">
    INTERACTIVE 3D LAND EXPLORER
  </div>

  <input
    id="searchInput"
    type="text"
    placeholder="Search parcel ID, e.g. EG-1001"
  >

  <div class="actions">
    <button id="searchBtn">Search</button>
    <button id="resetBtn">Reset Globe</button>
  </div>

  <div id="status">
    Initializing the 3D Earth...
  </div>

  <div id="parcelInfo">
    <div>Parcel: <strong id="parcelId">—</strong></div>
    <div>Latitude: <strong id="parcelLat">—</strong></div>
    <div>Longitude: <strong id="parcelLon">—</strong></div>
    <div>Demo price: <strong id="parcelPrice">—</strong></div>
    <div style="margin-top:6px;color:#aab8cc;font-size:11px">
      Demonstration parcel only. Not a legal land title.
    </div>
  </div>
</div>

<div id="legend">
  <div><span class="dot"></span>Land parcel boundaries</div>
  <div>Tap a parcel to select it</div>
  <div>Drag to rotate · Pinch to zoom</div>
</div>

<div id="hint">
  EARTHGRID · INTERACTIVE GLOBE
</div>
